# Supabase's free plan pauses a project after about a week with no activity.
# This reads one row of the public price list twice a week so the database
# stays awake even when nobody visits the site (e.g. during school holidays).
# It uses only the public publishable key that is already in js/auth.js.
# If the database is paused or down, this job fails and GitHub emails the repo owner.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 1 * * 1,4'   # Monday and Thursday, 08:17 Bangkok time
  workflow_dispatch: {}       # "Run workflow" button for a manual check

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: js/auth.js
          sparse-checkout-cone-mode: false

      - name: Read one price from the database
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/auth.js | head -1)
          KEY=$(grep -oE "sb_publishable_[A-Za-z0-9_-]+" js/auth.js | head -1)
          test -n "$URL" && test -n "$KEY" || { echo "Could not find the Supabase URL/key in js/auth.js"; exit 1; }
          for attempt in 1 2 3; do
            CODE=$(curl -s -o body.json -w '%{http_code}' --max-time 30 \
              "$URL/rest/v1/price_list?select=key&limit=1" -H "apikey: $KEY")
            echo "Attempt $attempt: HTTP $CODE $(head -c 120 body.json)"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase did not answer. The project may be paused - open supabase.com/dashboard and press Restore."
          exit 1
