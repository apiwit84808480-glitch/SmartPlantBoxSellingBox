<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — SPR Selling Website</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0b090e">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@200;300;400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">
    <header class="adm-top">
        <a class="logo" href="/">
            <span class="logo-mark"><i class="fas fa-seedling"></i></span>
            <span>Smart Plant Box <em>Admin</em></span>
        </a>
        <div class="adm-top-right">
            <span class="adm-live" id="liveDot" hidden><i></i> Live</span>
            <span class="adm-user" id="admUser"></span>
            <button class="btn btn-ghost adm-small" id="signOutBtn" type="button" hidden><i class="fas fa-arrow-right-from-bracket"></i> Sign out</button>
        </div>
    </header>

    <main class="adm-main">
        <!-- Shown until we know who is signed in -->
        <section class="adm-gate" id="gate">
            <div class="adm-gate-card">
                <span class="eyebrow">Team only</span>
                <h1 id="gateTitle">Loading…</h1>
                <p id="gateText"></p>
                <button class="acct-google" id="gateGoogle" type="button" hidden>
                    <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
                    Sign in with Google
                </button>
                <a class="btn btn-ghost adm-small" id="gateHome" href="/" hidden>Back to the shop</a>
            </div>
        </section>

        <!-- Orders dashboard (admins only; the database enforces this too) -->
        <section class="adm-dash" id="dash" hidden>
            <div class="adm-head">
                <div>
                    <span class="eyebrow">Orders</span>
                    <h1>Who ordered what</h1>
                </div>
                <div class="adm-head-actions">
                    <button class="btn btn-ghost adm-small adm-toggle" id="emailBtn" type="button" aria-pressed="false" title="Get an email for every new order (just for you)"><i class="fas fa-envelope"></i> <span id="emailLabel">Email alerts: Off</span></button>
                    <button class="btn btn-ghost adm-small" id="notifyBtn" type="button"><i class="fas fa-bell"></i> Desktop alerts</button>
                </div>
            </div>

            <div class="adm-stats">
                <div class="adm-stat"><span>New</span><strong id="stNew">0</strong></div>
                <div class="adm-stat"><span>Confirmed</span><strong id="stConfirmed">0</strong></div>
                <div class="adm-stat"><span>Shipped</span><strong id="stShipped">0</strong></div>
                <div class="adm-stat"><span>Revenue (not cancelled)</span><strong id="stRevenue">$0</strong></div>
            </div>

            <div class="adm-toolbar">
                <div class="adm-tabs" role="tablist" id="tabs">
                    <button class="active" data-status="all" type="button">All <b id="cAll">0</b></button>
                    <button data-status="new" type="button">New <b id="cNew">0</b></button>
                    <button data-status="confirmed" type="button">Confirmed <b id="cConfirmed">0</b></button>
                    <button data-status="shipped" type="button">Shipped <b id="cShipped">0</b></button>
                    <button data-status="cancelled" type="button">Cancelled <b id="cCancelled">0</b></button>
                </div>
                <label class="adm-search"><i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="search" placeholder="Search name, phone, email, order #" aria-label="Search orders">
                </label>
            </div>

            <div class="adm-list" id="list"></div>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
